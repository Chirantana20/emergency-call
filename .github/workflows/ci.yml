name: CI

# When this workflow runs:
#  - on every push to main (after a PR is merged)
#  - on every pull request targeting main
#  - manually, via the "Run workflow" button in the Actions tab
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# If you push two commits in a row, cancel the older run instead of wasting
# minutes finishing a build whose result no longer matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default permissions for every job: read-only. Each job that needs more
# (the docker job needs to push images) grants it explicitly for itself.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Lint: fails fast, in seconds, before anything else spends CI minutes
  # ---------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - run: pip install ruff

      - run: ruff check .

  # ---------------------------------------------------------------------
  # Test: the full pytest suite, with coverage
  # ---------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          # Cache pip downloads between runs, keyed on these files so the
          # cache is invalidated automatically whenever a dependency changes.
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Plain PyPI torch bundles several GB of CUDA libraries that are
      # useless on this CPU-only runner (same reasoning as the Dockerfile).
      # Installed before requirements-dev.txt so pip doesn't fetch the
      # default GPU build first and then redundantly swap it out.
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Download spaCy language model
        run: python -m spacy download en_core_web_sm

      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      # Uploaded even if the tests failed, so a coverage drop is visible
      # from the Actions UI without re-running anything.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # ---------------------------------------------------------------------
  # Docker: build the real image, smoke-test it, and (on main only)
  # publish it to GitHub Container Registry
  # ---------------------------------------------------------------------
  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # only used by the publish step, below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # GHCR wants a lowercase image path; github.repository can contain
      # uppercase letters if the account name does, so normalize it once.
      - name: Compute image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # Builds once, with every tag it might need, and loads the result
      # into the local Docker daemon so later steps can run it directly.
      # cache-from/cache-to use GitHub's own Actions cache, so a rebuild
      # after a small code change reuses the (large, slow) dependency
      # layers instead of redownloading torch and the ML models.
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: |
            emergency-call:ci
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: docker run -d --rm -p 7860:7860 --name emergency-call-ci emergency-call:ci

      - name: Smoke test
        run: WAIT_SECONDS=120 scripts/smoke_test.sh http://localhost:7860

      # Printed on every run, success or failure — the main way to debug a
      # smoke-test failure, since the container itself is torn down next.
      - name: Container logs
        if: always()
        run: docker logs emergency-call-ci || true

      - name: Stop container
        if: always()
        run: docker stop emergency-call-ci || true

      # Publishing only happens for commits actually landing on main, never
      # for pull requests — a PR from a fork wouldn't have push access to
      # the registry anyway, and untrusted PR code shouldn't be published
      # regardless.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image was already built and tagged above; this just pushes the
      # existing local image, so it doesn't rebuild anything.
      - name: Push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "ghcr.io/${IMAGE_NAME}:latest"
          docker push "ghcr.io/${IMAGE_NAME}:${{ github.sha }}"
